services:
  auto-sklearn:
    build:
      context: ./auto-sklearn
    platform: linux/amd64 # Apple Silicon Rosetta 2 fallback
    ports:
      - "8881:8888"
    volumes:
      - .:/workspace
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  auto-pytorch:
    build:
      context: ./auto-pytorch
    platform: linux/amd64
    ports:
      - "8882:8888"
    volumes:
      - .:/workspace
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  lazypredict:
    build:
      context: ./lazypredict
    platform: linux/amd64
    ports:
      - "8883:8888"
    volumes:
      - .:/workspace
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''